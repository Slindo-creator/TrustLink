server:
  port: ${PORT:8080}

spring:
  application:
    name: trustlink-backend
  datasource:
    url: jdbc:postgresql://aws-0-eu-west-2.pooler.supabase.com:5432/postgres?sslmode=require
    username: postgres.abvzohmckzjecdybneol
    password: ${SUPABASE_DB_PASSWORD:kE?!C6VdW6j4M6!}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate auto-DDL
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

app:
  storage:
    # Local disk for the hackathon build. Swap for S3-compatible object storage (ideally
    # an SA-region bucket, given the POPIA data-residency discussion) before production -
    # this path won't survive a redeploy on most hosting platforms.
    verification-upload-dir: ${VERIFICATION_UPLOAD_DIR:./uploads/verification}
    max-verification-file-size-bytes: ${MAX_VERIFICATION_FILE_SIZE_BYTES:5242880} # 5MB
  cors:
    # Comma-separated list of allowed frontend origins. Never use "*" once auth is in play.
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:3000}

  jwt:
    # Override via env var in every real deployment - never ship the default secret.
    secret: ${JWT_SECRET:REPLACE_WITH_A_LONG_RANDOM_SECRET_AT_LEAST_32_BYTES}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}       # access token - deliberately short-lived (1h default)
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
  rate-limit:
    auth-requests-per-minute: ${AUTH_RATE_LIMIT:10}

logging:
  level:
    com.trustlink: INFO
